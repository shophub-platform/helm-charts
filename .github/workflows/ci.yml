name: CI

on:
  pull_request:
  push:
    branches: [main, develop]
    tags: ['v*']

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  REGISTRY_OWNER: ${{ github.repository_owner }}

jobs:
  commitlint:
    name: Conventional Commits
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: wagoid/commitlint-github-action@v6

  helm-lint:
    name: Helm Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4

      - name: Dodaj bitnami repo (za dependency resolution)
        run: helm repo add bitnami https://charts.bitnami.com/bitnami

      - name: helm dep update za sve chart-ove
        run: |
          for c in charts/*/; do
            if grep -q "dependencies" "$c/Chart.yaml" 2>/dev/null; then
              echo "== helm dep update $c =="
              helm dep update "$c"
            fi
          done

      - name: Lint sve chart-ove
        run: |
          shopt -s nullglob
          charts=(charts/*/)
          if [ ${#charts[@]} -eq 0 ]; then
            echo "Još nema chart-ova — skeleton prolazi (F0)."
            exit 0
          fi
          for c in "${charts[@]}"; do
            echo "== helm lint $c =="
            helm lint "$c"
          done

      - name: Template dry-run za sve chart-ove
        run: |
          for c in charts/*/; do
            echo "== helm template dry-run $c =="
            helm template test "$c" > /dev/null
          done

  publish:
    name: Publish OCI charts → ghcr.io
    runs-on: ubuntu-latest
    needs: [helm-lint]
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4

      - name: Dodaj bitnami repo
        run: helm repo add bitnami https://charts.bitnami.com/bitnami

      - name: helm dep update
        run: |
          for c in charts/*/; do
            if grep -q "dependencies" "$c/Chart.yaml" 2>/dev/null; then
              helm dep update "$c"
            fi
          done

      - name: Login na ghcr.io
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io \
            --username "${{ github.actor }}" \
            --password-stdin

      - name: Pakuj i push-uj sve chart-ove
        run: |
          for c in charts/*/; do
            name=$(basename "$c")
            version=$(grep '^version:' "$c/Chart.yaml" | awk '{print $2}')
            echo "== Packaging $name @ $version =="
            helm package "$c" --destination /tmp/charts/
            helm push "/tmp/charts/${name}-${version}.tgz" \
              "oci://${{ env.REGISTRY }}/${{ env.REGISTRY_OWNER }}/helm-charts"
            echo "Pushed: oci://${{ env.REGISTRY }}/${{ env.REGISTRY_OWNER }}/helm-charts/${name}:${version}"
          done
