apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "shop-operator.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "shop-operator.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "shop-operator.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        {{- include "shop-operator.labels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "shop-operator.serviceAccountName" . }}
      containers:
        - name: operator
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - --metrics-bind-address=:8080
            - --health-probe-bind-address=:8081
          env:
            - name: SHOP_NAMESPACE
              value: {{ .Values.shopNamespace | quote }}
            - name: DEFAULT_SHOP_IMAGE
              value: {{ .Values.defaultShopImage | quote }}
            - name: DEFAULT_FRONTEND_IMAGE
              value: {{ .Values.defaultFrontendImage | quote }}
            - name: INGRESS_DOMAIN
              value: {{ .Values.ingressDomain | quote }}
            - name: WALLET_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "shop-operator.fullname" . }}-secrets
                  key: walletEncryptionKey
            {{- if .Values.sepoliaRpcUrl }}
            - name: SEPOLIA_RPC_URL
              value: {{ .Values.sepoliaRpcUrl | quote }}
            {{- end }}
            {{- if .Values.mockusdtAddress }}
            - name: MOCKUSDT_ADDRESS
              value: {{ .Values.mockusdtAddress | quote }}
            {{- end }}
            {{- if .Values.clusterDiscordWebhookUrl }}
            - name: CLUSTER_DISCORD_WEBHOOK_URL
              value: {{ .Values.clusterDiscordWebhookUrl | quote }}
            - name: CLUSTER_ALERTS_NAMESPACE
              value: {{ .Values.clusterAlertsNamespace | quote }}
            {{- end }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8081
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8081
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "shop-operator.fullname" . }}-secrets
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "shop-operator.labels" . | nindent 4 }}
type: Opaque
stringData:
  walletEncryptionKey: {{ .Values.walletEncryptionKey | quote }}
