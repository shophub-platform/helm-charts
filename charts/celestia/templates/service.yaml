apiVersion: v1
kind: Service
metadata:
  name: {{ include "celestia.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "celestia.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - name: rpc
      port: {{ .Values.service.rpcPort }}
      targetPort: rpc
    - name: p2p
      port: {{ .Values.service.p2pPort }}
      targetPort: p2p
  selector:
    app.kubernetes.io/name: celestia
    app.kubernetes.io/instance: {{ .Release.Name }}
