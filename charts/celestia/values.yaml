image:
  repository: ghcr.io/celestiaorg/celestia-node
  tag: "v0.21.0"
  pullPolicy: IfNotPresent

nodeType: "light"
network: "mocha"

service:
  type: ClusterIP
  rpcPort: 26658
  p2pPort: 2121

persistence:
  enabled: true
  size: 5Gi
  storageClass: ""

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi
